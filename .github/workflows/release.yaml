---
name: Release
on:
  push:
    branches:
      - main
    paths:
      - apps/odysseus/**
  schedule:
    # Rebuild the current tracked Odysseus main revision weekly with a fresh date tag.
    - cron: "17 06 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: odysseus

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set date tag
        id: date
        run: echo "tag=v$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and Push
        env:
          REGISTRY: ${{ env.REGISTRY }}
          REPO_OWNER: ${{ github.repository_owner }}
          APP: ${{ env.IMAGE_NAME }}
          DATE_TAG: ${{ steps.date.outputs.tag }}
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: apps/odysseus
          set: |
            image-all.platform=linux/amd64,linux/arm64
            image-all.output=type=registry,push=true,compression=zstd,force-compression=true
