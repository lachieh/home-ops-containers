---
name: Release Mem0

on:
  push:
    branches:
      - main
    paths:
      - apps/mem0-api/**
      - apps/mem0-dashboard/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: mem0-api
            source: apps/mem0-api
          - app: mem0-dashboard
            source: apps/mem0-dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set date tag
        id: date
        run: echo "tag=v$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build and push
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          REGISTRY: ghcr.io
          REPO_OWNER: ${{ github.repository_owner }}
          APP: ${{ matrix.app }}
          DATE_TAG: ${{ steps.date.outputs.tag }}
        with:
          source: ${{ matrix.source }}
          set: |
            image-all.platform=linux/amd64,linux/arm64
            image-all.output=type=registry,push=true,compression=zstd,force-compression=true
