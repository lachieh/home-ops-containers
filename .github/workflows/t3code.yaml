---
name: Release T3 Code

on:
  push:
    branches:
      - main
    paths:
      - apps/t3code/**
  schedule:
    # Package the newest T3 Code nightly once a day; the homelab picks up the date tag.
    - cron: "23 07 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: t3code

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Resolve latest nightly
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(gh api 'repos/pingdotgg/t3code/releases?per_page=100' \
            --jq '[.[] | select(.tag_name | test("^v[0-9.]+-nightly\\.")) | .tag_name][0] | ltrimstr("v")')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Skip versions already published
        id: published
        if: github.event_name == 'schedule'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
        run: |
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Docker Buildx
        if: steps.published.outputs.skip != 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and Push
        if: steps.published.outputs.skip != 'true'
        env:
          REGISTRY: ${{ env.REGISTRY }}
          REPO_OWNER: ${{ github.repository_owner }}
          APP: ${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.version.outputs.version }}
          DATE_TAG: ${{ steps.version.outputs.tag }}
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: apps/t3code
          set: |
            image-all.platform=linux/amd64,linux/arm64
            image-all.output=type=registry,push=true,compression=zstd,force-compression=true
